<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">

<body>
    <h1> Funciones en JS </h1>
    <button onclick="saludar()"> Saludo</button>
    <h3> <Parametros y argumentos </h3>
        <button onclick="solicitarDatos()">Ejemplo<button>
    <script>
        function calcularPrecio(precio,cantidad){  
            let total=precio*cantidad; 
            alert("El precio total es: " +total);         
        }
        function solicitarDatos(){
            let solicitarPrecio=prompt("Ingrese el costo del producto:");
            let solicitarCant=prompt("Colocar las unidades:");
            calcularPrecio(solicitarPrecio, solicitarCant);
        }

        function saludar(){
            let nombre=prompt("Como te llamas?");
            if(nombre){
                alert("Hola "+nombre);
            } else {alert ("Debes escribir tu nombre");
            }
            }
    
     </script>
</body>
